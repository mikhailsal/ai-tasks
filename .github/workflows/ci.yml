name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'

jobs:
  quality:
    name: Quality and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check workflow definitions
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Verify production migration and reopen
        env:
          AI_TASKS_DB_PATH: ${{ runner.temp }}/migration/application.sqlite
          AI_TASKS_BACKUP_DIR: ${{ runner.temp }}/migration/backups
        run: |
          npm run db:migrate
          node dist/migrate.js
          node dist/cli.js meta --all-projects --json
      - run: npm run build
      - name: Check every emitted browser JavaScript asset
        run: npm run check:bundle-size | tee artifacts/checks/bundle.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-evidence
          path: artifacts/checks/
          retention-days: 7
          if-no-files-found: warn

  functional:
    name: Functional contracts ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
      - name: Run all unit, integration and compiled contracts
        env:
          SHARD: ${{ matrix.shard }}
        run: npm run test:functional -- --shard="$SHARD/2" 2>&1 | tee artifacts/checks/functional.log
      - name: Run executable quickstart against a disposable database
        if: matrix.shard == 1
        run: node scripts/run-suite.mjs functional -- node scripts/validate-quickstart.mjs 2>&1 | tee artifacts/checks/quickstart.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: functional-${{ matrix.shard }}
          path: artifacts/checks/
          retention-days: 7
          if-no-files-found: warn

  contention:
    name: Independent process contention
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build:server
      - name: Run real file and process races
        run: npm run test:contention 2>&1 | tee artifacts/checks/contention.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: contention-evidence
          path: artifacts/checks/
          retention-days: 7
          if-no-files-found: warn

  browser:
    name: Browser ${{ matrix.browser }} ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prefer the Ubuntu archive for browser system packages
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' \
              $'https://archive.ubuntu.com/ubuntu/\tpriority:1' \
              $'http://azure.archive.ubuntu.com/ubuntu/\tpriority:2' \
              $'https://security.ubuntu.com/ubuntu/\tpriority:3' |
              sudo tee /etc/apt/apt-mirrors.txt
          fi
      - name: Install the selected browser and Linux libraries
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright install --with-deps "$BROWSER"
      - run: npm run build
      - name: Run production mobile, offline and recovery scenarios
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}
        run: npm run test:e2e -- --project="$BROWSER" --shard="$SHARD/2" 2>&1 | tee artifacts/checks/browser.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            artifacts/checks/
            test-results/
          retention-days: 7
          if-no-files-found: warn
